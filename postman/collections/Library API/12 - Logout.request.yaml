$kind: http-request
name: 'Logout'
order: 12000
method: POST
url: '{{baseUrl}}/api/logout'
headers:
  - key: Accept
    value: application/json
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // Assert HTTP 200
      pm.test("Logout: status is 200", function () {
          pm.response.to.have.status(200);
      });

      // Assert success flag
      pm.test("Logout: success is true", function () {
          const json = pm.response.json();
          pm.expect(json.success).to.be.true;
      });

      // Assert message
      pm.test("Logout: message is 'logout successful'", function () {
          const json = pm.response.json();
          pm.expect(json.message).to.eql("logout successful");
      });

      // Clean up dynamic variables from the environment after the full flow
      pm.environment.unset("storeId");
      pm.environment.unset("bookId");
      pm.collectionVariables.set("storeId", "");
      pm.collectionVariables.set("bookId", "");
      console.log("Session ended. storeId and bookId cleared.");
